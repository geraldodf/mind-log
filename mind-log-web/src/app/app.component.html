<div class="min-h-screen bg-surface-bg">

  @if (isAuthenticated) {
    <app-shell
      [username]="username"
      (signOutEmitter)="signOut()">
    </app-shell>
  }

  <!-- Sem `max-w` nem `mx-auto`: as telas ocupam a largura toda disponível.
       Cada página decide o próprio ritmo interno. -->
  <main class="min-h-screen" [ngClass]="isAuthenticated ? 'md:ml-64 pt-14 md:pt-0 pb-24 md:pb-0' : ''">
    <div class="w-full px-4 sm:px-6 py-6 sm:py-8">
      <router-outlet></router-outlet>
    </div>
  </main>

  <ngx-ui-loader></ngx-ui-loader>
</div>
