<app-modal [open]="true" size="sm" [title]="options.title || ('confirm.title' | translate)"
           [hasFooter]="true" (closed)="modalRef.close(confirmed)">
  <div class="flex items-start gap-3 p-4 rounded-card bg-warning-50 dark:bg-warning-500/10">
    <div class="w-9 h-9 rounded-control bg-warning-100 dark:bg-warning-500/15 flex items-center justify-center flex-shrink-0">
      <app-icon name="triangle-exclamation" size="sm" class="text-warning-700 dark:text-warning-400"></app-icon>
    </div>
    <div class="min-w-0">
      <p class="text-sm font-medium text-ink mb-1">{{ 'confirm.sure' | translate }}</p>
      @if (target) {
        <p class="text-sm text-ink mb-1 font-semibold break-words">{{ target }}</p>
      }
      <p class="text-sm text-ink-muted">{{ options.description || ('confirm.description' | translate) }}</p>
    </div>
  </div>

  <ng-container modalFooter>
    <app-btn variant="ghost" (click)="onCancel()">{{ 'common.cancel' | translate }}</app-btn>
    <app-btn variant="danger-solid" (click)="onConfirm()">{{ options.confirmLabel || ('common.confirm' | translate) }}</app-btn>
  </ng-container>
</app-modal>
