<div class="modal-header">
  <h4 class="modal-title">{{ 'confirm.title' | translate }}</h4>
  <button type="button" class="btn-close" [attr.aria-label]="'common.close' | translate" (click)="onCancel()"></button>
</div>
<div class="modal-body">
  <div class="flex items-start gap-3 p-4 rounded-card bg-warning-50 dark:bg-warning-500/10 border border-warning-200 dark:border-warning-500/20">
    <div class="w-9 h-9 rounded-control bg-warning-100 dark:bg-warning-500/15 flex items-center justify-center flex-shrink-0">
      <i class="fa-solid fa-triangle-exclamation text-warning-600 dark:text-warning-400 text-sm" aria-hidden="true"></i>
    </div>
    <div>
      <p class="text-sm font-medium text-ink mb-1">{{ 'confirm.sure' | translate }}</p>
      @if (target) {
        <p class="text-sm text-ink mb-1 font-semibold break-words">{{ target }}</p>
      }
      <p class="text-sm text-ink-muted mb-0">{{ 'confirm.description' | translate }}</p>
    </div>
  </div>
</div>
<div class="modal-footer">
  <app-btn variant="ghost" (click)="onCancel()">{{ 'common.cancel' | translate }}</app-btn>
  <app-btn variant="danger-solid" (click)="onConfirm()">{{ 'common.confirm' | translate }}</app-btn>
</div>
