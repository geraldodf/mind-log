<nav>
  <ul class="flex items-center gap-1 list-none p-0 m-0">

    <!-- Prev -->
    <li (click)="fetchToPage(pageNumber - 1)"
        [class.opacity-30]="pageNumber === 1"
        [class.pointer-events-none]="pageNumber === 1">
      <button class="btn-icon-ios w-8 h-8 rounded-control" [disabled]="pageNumber === 1">
        <i class="fa-solid fa-angles-left text-xs"></i>
      </button>
    </li>

    <!-- Page numbers -->
    <li *ngFor="let page of pages"
        (click)="fetchToPage(page)"
        [class.pointer-events-none]="page === -1">
      <button *ngIf="page !== -1"
              class="w-8 h-8 rounded-control text-xs font-semibold transition-all duration-200 flex items-center justify-center"
              [ngClass]="page === pageNumber
                ? 'bg-primary-600 text-ink-invert'
                : 'text-ink-muted hover:text-ink hover:bg-surface-sunken'">
        {{ page }}
      </button>
      <span *ngIf="page === -1"
            class="w-8 h-8 flex items-center justify-center text-ink-subtle text-xs font-bold">
        ...
      </span>
    </li>

    <!-- Next -->
    <li (click)="fetchToPage(pageNumber + 1)"
        [class.opacity-30]="pageNumber === totalPages"
        [class.pointer-events-none]="pageNumber === totalPages">
      <button class="btn-icon-ios w-8 h-8 rounded-control" [disabled]="pageNumber === totalPages">
        <i class="fa-solid fa-angles-right text-xs"></i>
      </button>
    </li>

  </ul>
</nav>
