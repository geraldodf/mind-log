<div class="modal-body p-0">

  <!-- Step content -->
  <div class="flex flex-col items-center text-center px-8 pt-8 pb-6 gap-6">

    <!-- Icon -->
    <div class="w-20 h-20 rounded-card flex items-center justify-center flex-shrink-0"
         [ngClass]="current.iconBg">
      <i class="text-3xl" [ngClass]="[current.icon, current.iconColor]" aria-hidden="true"></i>
    </div>

    <!-- Text: altura mínima fixa para o modal não "pular" de tamanho entre passos -->
    <div class="flex flex-col gap-2 max-w-sm min-h-[132px]">
      <h4 class="text-lg font-bold text-ink mb-0">
        {{ current.titleKey | translate }}
      </h4>
      <p class="text-sm font-medium text-ink-muted mb-0">
        {{ current.descriptionKey | translate }}
      </p>
      <p class="text-sm text-ink-subtle mb-0">
        {{ current.detailKey | translate }}
      </p>
    </div>

    <!-- Step dots -->
    <div class="flex items-center gap-2 mt-1">
      @for (step of steps; track $index) {
        <button
          type="button"
          class="rounded-full transition-[width,background-color] duration-base ease-inout border-none cursor-pointer p-0"
          [class]="$index === currentStep
            ? 'w-6 h-2 bg-primary-500'
            : 'w-2 h-2 bg-hairline-strong hover:bg-ink-subtle'"
          [attr.aria-label]="('onboarding.goToStep' | translate) + ' ' + ($index + 1)"
          [attr.aria-current]="$index === currentStep ? 'step' : null"
          (click)="currentStep = $index">
        </button>
      }
    </div>

  </div>

  <!-- Footer -->
  <div class="flex items-center justify-between px-8 py-6 border-t border-hairline">

    <button class="btn-ghost-ios text-sm" (click)="skip()">
      {{ 'onboarding.skip' | translate }}
    </button>

    <div class="flex items-center gap-2">
      @if (!isFirst) {
        <button class="btn-ghost-ios" (click)="prev()">
          <i class="fa-solid fa-arrow-left text-xs mr-2" aria-hidden="true"></i>
          {{ 'onboarding.prev' | translate }}
        </button>
      }
      @if (!isLast) {
        <button class="btn-primary-ios" (click)="next()">
          {{ 'onboarding.next' | translate }}
          <i class="fa-solid fa-arrow-right text-xs ml-2" aria-hidden="true"></i>
        </button>
      } @else {
        <button class="btn-primary-ios" (click)="finish()" routerLink="/media/new">
          {{ 'onboarding.finish' | translate }}
          <i class="fa-solid fa-rocket text-xs ml-2" aria-hidden="true"></i>
        </button>
      }
    </div>

  </div>

</div>
