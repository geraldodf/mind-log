<div class="modal-header">
  <h4 class="modal-title">Confirme para continuar</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="onCancel()"></button>
</div>
<div class="modal-body">
  <div class="flex items-start gap-3 p-4 rounded-card bg-warning-50 dark:bg-warning-500/10 border border-warning-200 dark:border-warning-500/20">
    <div class="w-9 h-9 rounded-control bg-warning-100 dark:bg-warning-500/15 flex items-center justify-center flex-shrink-0 mt-0.5">
      <i class="fa-solid fa-triangle-exclamation text-warning-600 dark:text-warning-400 text-sm"></i>
    </div>
    <div>
      <p class="text-sm font-medium text-ink mb-0.5">Tem certeza?</p>
      <p class="text-sm text-ink-muted mb-0">Você tem certeza que deseja continuar? Esta ação não pode ser desfeita.</p>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn-ghost-ios" (click)="onCancel()">Cancelar</button>
  <button type="button" class="btn-primary-ios" (click)="onConfirm()">Confirmar</button>
</div>
