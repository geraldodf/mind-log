<div class="w-full">
  <app-page-header [title]="'mediaType.title' | translate" [subtitle]="'mediaType.subtitle' | translate"></app-page-header>

  <app-card padding="sm" class="block mb-6">
    <label class="ios-label">{{ 'mediaType.addCustom' | translate }}</label>
    <div class="flex gap-2">
      <input type="text" class="ios-input flex-1" [(ngModel)]="newName"
             [placeholder]="'mediaType.placeholder' | translate"
             (keyup.enter)="create()">
      <app-btn variant="primary" icon="fa-solid fa-plus" [loading]="creating" [disabled]="!newName.trim()" (click)="create()">
        {{ 'common.add' | translate }}
      </app-btn>
    </div>
  </app-card>

  @if (loading) {
    <app-card padding="sm">
      <app-skeleton variant="text" [lines]="3"></app-skeleton>
    </app-card>
  } @else {
    <app-card padding="none" [clip]="true" class="block">

      @if (all.length === 0) {
        <app-empty-state icon="fa-solid fa-tags" [title]="'mediaType.noTypes' | translate"></app-empty-state>
      }

      <ul class="divide-y divide-hairline list-none m-0 p-0">
        @for (type of all; track type.id) {
          <li class="flex items-center gap-3 px-5 py-3.5">
            <div class="w-2 h-2 rounded-full flex-shrink-0"
                 [class.bg-primary-400]="type.isSystem"
                 [class.bg-success-400]="!type.isSystem"></div>
            <span class="flex-1 text-sm text-ink font-medium">{{ type.name | systemName }}</span>
            @if (type.isSystem) {
              <app-badge tone="neutral">{{ 'common.system' | translate }}</app-badge>
            } @else {
              <button (click)="delete(type.id)"
                      class="btn-icon-ios w-7 h-7 text-danger-400 hover:text-danger-500 hover:bg-danger-50 dark:hover:bg-danger-500/10">
                <i class="fa-solid fa-trash text-xs"></i>
              </button>
            }
          </li>
        }
      </ul>
    </app-card>
  }
</div>
