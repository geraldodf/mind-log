<div class="min-h-dvh flex items-center justify-center bg-surface-bg relative overflow-hidden px-4 py-8 short:py-4">

  <!-- Ambient brand glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden bg-grad-glow"></div>

  <div class="w-full max-w-sm relative z-10 animate-fade-in-up">

    <!-- Brand -->
    <div class="text-center mb-8">
      <app-brand-mark size="lg" class="mb-4"></app-brand-mark>
      <h1 class="font-display text-2xl font-bold tracking-tight text-ink mb-1">MindLog</h1>
      <p class="text-sm text-ink-muted">{{ 'auth.signInTagline' | translate }}</p>
    </div>

    <!-- Card -->
    <div class="bg-surface-card border border-hairline rounded-panel p-8 shadow-lg">

      <!-- Error Alert -->
      <app-alert *ngIf="invalidLogin" class="block mb-6">{{ 'auth.invalidCredentials' | translate }}</app-alert>
      <app-alert *ngIf="loginError" class="block mb-6">{{ loginError }}</app-alert>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <!-- Username -->
        <div class="mb-4">
          <app-form-input id="sign-in-username" formControlName="username"
                          [label]="'auth.username' | translate"
                          icon="user"
                          [placeholder]="'auth.usernamePlaceholder' | translate"
                          autocomplete="username"
                          [invalid]="form.controls.username.touched && form.controls.username.invalid"
                          [errorMessage]="'auth.usernameRequired' | translate"></app-form-input>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <app-form-input id="sign-in-password" formControlName="password"
                          [label]="'auth.password' | translate"
                          icon="lock"
                          [placeholder]="'auth.passwordPlaceholder' | translate"
                          type="password" [passwordToggle]="true" autocomplete="current-password"
                          [invalid]="form.controls.password.touched && form.controls.password.invalid"
                          [errorMessage]="'auth.passwordRequired' | translate">
          </app-form-input>
        </div>

        <app-btn variant="gradient" type="submit" size="lg" [fullWidth]="true" [loading]="submitting">
          {{ 'auth.signIn' | translate }}
        </app-btn>

        <app-google-sign-in [label]="'auth.signInWithGoogle' | translate"></app-google-sign-in>

        <p class="text-center text-sm text-ink-muted mt-6 mb-0">
          {{ 'auth.noAccount' | translate }}
          <app-text-link link="/auth/sign-up" class="ml-1">{{ 'auth.signUp' | translate }}</app-text-link>
        </p>
      </form>
    </div>

    <p class="text-center text-xs text-ink-subtle mt-6">
      &copy; 2026 MindLog. {{ 'auth.rights' | translate }}
    </p>
  </div>
</div>
