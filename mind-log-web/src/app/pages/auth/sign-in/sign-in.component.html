<div class="min-h-screen flex items-center justify-center bg-surface-bg relative overflow-hidden px-4">

  <!-- Ambient brand glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden bg-grad-glow"></div>

  <div class="w-full max-w-sm relative z-10 animate-slide-up">

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-card bg-grad-brand shadow-md mb-4">
        <svg viewBox="0 0 64 64" class="w-8 h-8" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="22" cy="32" r="8.5" stroke-width="5"/>
          <circle cx="22" cy="32" r="2.5" fill="#FFFFFF" stroke="none"/>
          <path d="M35 24h14M35 32h11M35 40h14" stroke-width="5"/>
        </svg>
      </div>
      <h1 class="font-display text-2xl font-bold tracking-tight text-ink mb-1">MindLog</h1>
      <p class="text-sm text-ink-muted">Faça login para registrar seus pensamentos</p>
    </div>

    <!-- Card -->
    <div class="bg-surface-card border border-hairline rounded-panel p-8 shadow-lg">

      <!-- Error Alert -->
      <div *ngIf="invalidLogin"
           class="flex items-center gap-3 p-3 rounded-control bg-danger-50 dark:bg-danger-500/10 border border-danger-200 dark:border-danger-500/20 mb-5">
        <i class="fa-solid fa-circle-exclamation text-danger-500 dark:text-danger-400 flex-shrink-0 text-sm"></i>
        <span class="text-sm text-danger-600 dark:text-danger-400">Usuário ou senha incorretos.</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <!-- Username -->
        <div class="mb-4">
          <app-form-input id="sign-in-username" formControlName="username"
                          label="Usuário" icon="fa-regular fa-user" placeholder="Seu usuário"
                          autocomplete="username"
                          [invalid]="form.controls.username.touched && form.controls.username.invalid"
                          errorMessage="Por favor, insira seu usuário."></app-form-input>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <app-form-input id="sign-in-password" formControlName="password"
                          label="Senha" icon="fa-regular fa-lock" placeholder="Sua senha"
                          type="password" [passwordToggle]="true" autocomplete="current-password"
                          [invalid]="form.controls.password.touched && form.controls.password.invalid"
                          errorMessage="Por favor, insira sua senha.">
            <a labelAction routerLink="" class="text-xs font-medium text-primary-600 dark:text-primary-400 hover:text-primary-500 transition-colors no-underline">
              Esqueceu a senha?
            </a>
          </app-form-input>
        </div>

        <app-btn variant="gradient" type="submit" size="lg" [fullWidth]="true" [disabled]="form.invalid">
          Entrar
        </app-btn>

        <div class="flex items-center gap-3 my-5">
          <div class="flex-1 h-px bg-hairline"></div>
          <span class="text-xs text-ink-subtle">ou</span>
          <div class="flex-1 h-px bg-hairline"></div>
        </div>

        <a [href]="googleAuthUrl"
           class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-control border border-hairline bg-surface-sunken hover:border-hairline-strong transition-colors no-underline text-sm font-medium text-ink-muted">
          <svg class="w-4 h-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Entrar com Google
        </a>

        <p class="text-center text-sm text-ink-muted mt-5 mb-0">
          Não tem uma conta?
          <a routerLink="/auth/sign-up" class="font-semibold text-primary-600 dark:text-primary-400 hover:text-primary-500 transition-colors no-underline ml-1">Cadastre-se</a>
        </p>
      </form>
    </div>

    <p class="text-center text-xs text-ink-subtle mt-6">
      &copy; 2026 MindLog. Todos os direitos reservados.
    </p>
  </div>
</div>
