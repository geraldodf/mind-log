<div class="min-h-dvh flex items-center justify-center bg-surface-bg relative overflow-hidden px-4 py-8 short:py-4">

  <!-- Ambient brand glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden bg-grad-glow"></div>

  <div class="w-full max-w-sm relative z-10 animate-fade-in-up">

    <div class="text-center mb-8">
      <app-brand-mark size="lg" class="mb-4"></app-brand-mark>
      <h1 class="font-display text-2xl font-bold tracking-tight text-ink mb-1">MindLog</h1>
      <p class="text-sm text-ink-muted">{{ 'auth.signUpTagline' | translate }}</p>
    </div>

    <div class="bg-surface-card border border-hairline rounded-panel p-8 shadow-lg">

      <app-alert *ngIf="success" variant="success" class="block mb-6">{{ 'auth.accountCreated' | translate }}</app-alert>

      <app-alert *ngIf="errorMessage" class="block mb-6">{{ errorMessage }}</app-alert>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="mb-4">
          <app-form-input id="sign-up-name" formControlName="name"
                          [label]="'auth.name' | translate"
                          icon="id-card"
                          [placeholder]="'auth.namePlaceholder' | translate"
                          autocomplete="name"
                          [invalid]="form.controls.name.touched && form.controls.name.invalid"
                          [errorMessage]="'auth.nameMin' | translate"></app-form-input>
        </div>

        <div class="mb-4">
          <app-form-input id="sign-up-username" formControlName="username"
                          [label]="'auth.username' | translate"
                          icon="user"
                          [placeholder]="'auth.usernameSignUpPlaceholder' | translate"
                          autocomplete="username"
                          [invalid]="form.controls.username.touched && form.controls.username.invalid"
                          [errorMessage]="'auth.usernameMin' | translate"></app-form-input>
        </div>

        <div class="mb-4">
          <app-form-input id="sign-up-email" formControlName="email"
                          [label]="'auth.email' | translate"
                          icon="envelope"
                          [placeholder]="'auth.emailPlaceholder' | translate"
                          type="email" autocomplete="email"
                          [invalid]="form.controls.email.touched && form.controls.email.invalid"
                          [errorMessage]="'auth.emailRequired' | translate"></app-form-input>
        </div>

        <div class="mb-4">
          <app-form-input id="sign-up-password" formControlName="password"
                          [label]="'auth.password' | translate"
                          icon="lock"
                          [placeholder]="'auth.passwordSignUpPlaceholder' | translate"
                          type="password" [passwordToggle]="true" autocomplete="new-password"
                          [invalid]="form.controls.password.touched && form.controls.password.invalid"
                          [errorMessage]="'auth.passwordRule' | translate"></app-form-input>
        </div>

        <div class="mb-6">
          <app-form-input id="sign-up-confirm-password" formControlName="confirmPassword"
                          [label]="'auth.confirmPassword' | translate"
                          icon="lock"
                          [placeholder]="'auth.confirmPasswordPlaceholder' | translate"
                          type="password" [passwordToggle]="true" autocomplete="new-password"
                          [invalid]="(form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid) || passwordMismatch"
                          [errorMessage]="passwordMismatch ? ('auth.passwordsDoNotMatch' | translate) : ''"></app-form-input>
        </div>

        <app-btn variant="gradient" type="submit" size="lg" [fullWidth]="true" [loading]="submitting" [disabled]="success">
          {{ 'auth.createAccountCta' | translate }}
        </app-btn>

        <app-google-sign-in [label]="'auth.continueWithGoogle' | translate"></app-google-sign-in>

        <p class="text-center text-sm text-ink-muted mt-6 mb-0">
          {{ 'auth.haveAccount' | translate }}
          <app-text-link link="/login" class="ml-1">{{ 'auth.signIn' | translate }}</app-text-link>
        </p>
      </form>
    </div>

    <p class="text-center text-xs text-ink-subtle mt-6">
      &copy; 2026 MindLog. {{ 'auth.rights' | translate }}
    </p>
  </div>
</div>
