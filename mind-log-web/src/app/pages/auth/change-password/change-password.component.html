<div class="w-full">
  <app-page-header title="Alterar Senha"></app-page-header>

  <app-card padding="none" [clip]="true" class="block">
    <div class="px-6 py-4 border-b border-hairline">
      <h5 class="text-base font-semibold text-ink">Segurança</h5>
    </div>
    <div class="p-6">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <!-- Password Fields -->
          <div class="flex flex-col gap-4">

            <div *ngIf="invalidPassword"
                 class="flex items-center gap-2 p-3 rounded-control bg-danger-50 dark:bg-danger-500/10 border border-danger-200 dark:border-danger-500/20 text-danger-600 dark:text-danger-400 text-sm">
              <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
              Senha incorreta. Digite e submeta novamente.
            </div>

            <!-- Current Password -->
            <app-form-input id="current-password" appPassword formControlName="currentPassword"
                            label="Senha atual" [required]="true" placeholder="Senha atual"
                            type="password" [passwordToggle]="true" autocomplete="off"
                            [invalid]="validation.isInvalidAndTouched(form.controls.currentPassword)"
                            [errorMessage]="validation.getValidationMessage(form.controls.currentPassword) ?? ''"></app-form-input>

            <!-- New Password -->
            <app-form-input id="new-password" appPassword formControlName="newPassword"
                            label="Nova Senha" [required]="true" placeholder="Nova senha"
                            type="password" [passwordToggle]="true" autocomplete="off"
                            [invalid]="validation.isInvalidAndTouched(form.controls.newPassword)"
                            [errorMessage]="validation.getValidationMessage(form.controls.newPassword) ?? ''"></app-form-input>

            <!-- Confirm Password -->
            <app-form-input id="confirm-new-password" appPassword formControlName="confirmNewPassword"
                            label="Confirmar Senha" placeholder="Confirme a senha"
                            type="password" [passwordToggle]="true" autocomplete="off"
                            [invalid]="validation.isInvalidAndTouched(form.controls.confirmNewPassword)"
                            [errorMessage]="validation.getValidationMessage(form.controls.confirmNewPassword) ?? ''"></app-form-input>

            <app-btn variant="primary" type="submit" [fullWidth]="true">Alterar senha</app-btn>
          </div>

          <!-- Requirements Card -->
          <div class="p-4 rounded-control border border-hairline bg-surface-sunken h-fit">
            <p class="text-sm font-semibold text-ink mb-3">Requisitos para senha</p>
            <p class="text-xs text-ink-muted mb-3">Para criar uma nova senha, você precisa atender a todos os seguintes requisitos:</p>
            <app-password-requirements [value]="form.controls.newPassword.value ?? ''"></app-password-requirements>
            <p class="flex items-center gap-2 text-xs text-ink-subtle mt-1 mb-0">
              <i class="fa-regular fa-circle"></i>
              Não pode ser igual a uma senha anterior
            </p>
          </div>

        </div>
      </form>
    </div>
  </app-card>
</div>
