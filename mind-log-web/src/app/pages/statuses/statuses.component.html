<div class="w-full">
  <app-page-header [title]="'status.title' | translate" [subtitle]="'status.subtitle' | translate"></app-page-header>

  <app-card padding="sm" class="block mb-6">
    <div class="flex gap-2 items-end">
      <app-form-input class="flex-1" [(ngModel)]="newName"
                      [label]="'status.addCustom' | translate"
                      [placeholder]="'status.placeholder' | translate"
                      (keyup.enter)="create()"></app-form-input>
      <app-btn variant="primary" icon="fa-solid fa-plus" [loading]="creating" [disabled]="!newName.trim()" (click)="create()">
        {{ 'common.add' | translate }}
      </app-btn>
    </div>
  </app-card>

  @if (loading) {
    <app-card padding="none" [clip]="true" class="block"
              role="status" [attr.aria-label]="'common.loading' | translate">
      <ul class="divide-y divide-hairline list-none m-0 p-0">
        @for (i of [1,2,3,4,5]; track i) {
          <li class="flex items-center gap-3 px-4 py-4">
            <app-skeleton variant="circle" size="sm"></app-skeleton>
            <app-skeleton variant="title" class="flex-1"></app-skeleton>
            <app-skeleton variant="chip"></app-skeleton>
          </li>
        }
      </ul>
    </app-card>
  } @else {
    <app-card padding="none" [clip]="true" class="block">

      @if (all.length === 0) {
        <app-empty-state icon="fa-solid fa-list-check" [title]="'status.noStatuses' | translate"></app-empty-state>
      }

      <ul class="divide-y divide-hairline list-none m-0 p-0">
        @for (status of all; track status.id) {
          <li class="flex items-center gap-3 px-6 py-4">
            <div class="w-2 h-2 rounded-full flex-shrink-0"
                 [class.bg-primary-400]="status.isSystem"
                 [class.bg-secondary-400]="!status.isSystem"></div>
            <span class="flex-1 text-sm text-ink font-medium">{{ status.name | systemName }}</span>
            @if (status.isSystem) {
              <app-badge tone="neutral">{{ 'common.system' | translate }}</app-badge>
            } @else {
              <app-icon-btn size="sm" variant="danger" icon="fa-solid fa-trash"
                          [ariaLabel]="'common.delete' | translate" (click)="delete(status.id)"></app-icon-btn>
            }
          </li>
        }
      </ul>
    </app-card>
  }
</div>
