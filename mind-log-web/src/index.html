<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>MindLog — seu registro de mídia</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MindLog é seu registro pessoal de tudo que você consome — filmes, séries, livros, jogos, cursos e podcasts — com status, nota, resenha e perfil público.">
  <meta name="theme-color" content="#0891B2">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="antialiased">
  <app-root></app-root>
</body>
</html>
