events{}
http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      # Sem `$uri/`: o build grava as fontes em `media/`, que colide com a rota
      # /media do app. Com a tentativa de diretório, /media virava 301 para
      # /media/ (perdendo a porta publicada) e caía em 403. Numa SPA não há
      # diretório para servir — tudo que não for arquivo vai para o index.
      try_files $uri /index.html;
    }
  }
}
